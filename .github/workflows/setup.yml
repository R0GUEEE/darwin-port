name: Setup utility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  setup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python3 -m unittest discover -s tests -p 'test_setup.py' -v
      - run: ./setup.sh plan --json
      - run: ./scripts/install.sh --check-only --no-sdk
      - run: ./setup.sh install --profile tools --no-packages --no-sdk
      - run: ./setup.sh run -- python3 inventory.py tests/fixtures
